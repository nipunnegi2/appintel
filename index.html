<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Store OSINT Tool</title>
    <style>
        :root {
            --primary-color: #007AFF;
            --secondary-color: #5AC8FA;
            --dark-color: #1D1D1F;
            --light-color: #F5F5F7;
            --danger-color: #FF3B30;
            --success-color: #34C759;
            --border-radius: 10px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        
        body {
            background-color: var(--light-color);
            color: var(--dark-color);
            min-height: 100vh;
            padding: 2rem;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }
        
        .subtitle {
            color: var(--dark-color);
            opacity: 0.8;
            font-size: 1.2rem;
        }
        
        .search-container {
            background-color: white;
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }
        
        .search-form {
            display: flex;
            gap: 1rem;
        }
        
        .search-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid #ddd;
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        .search-button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            padding: 0 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 120px;
        }
        
        .search-button:hover {
            background-color: var(--secondary-color);
        }
        
        .search-icon-btn {
            margin-left: 8px;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        .example-text {
            margin-top: 0.75rem;
            font-size: 0.9rem;
            color: #666;
        }
        
        .loader {
            display: none;
            text-align: center;
            margin: 2rem 0;
        }
        
        .spinner {
            position: relative;
            width: 60px;
            height: 60px;
            margin: 0 auto;
        }
        
        .search-icon {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .search-icon .circle {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 4;
            stroke-linecap: round;
            animation: searchCircle 2s infinite;
        }
        
        .search-icon .line {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 4;
            stroke-linecap: round;
            animation: searchLine 2s infinite;
        }
        
        @keyframes searchCircle {
            0% { stroke-dasharray: 150; stroke-dashoffset: 150; transform: rotate(0deg); }
            50% { stroke-dasharray: 150; stroke-dashoffset: 0; transform: rotate(180deg); }
            100% { stroke-dasharray: 150; stroke-dashoffset: 150; transform: rotate(360deg); }
        }
        
        @keyframes searchLine {
            0% { stroke-dasharray: 30; stroke-dashoffset: 30; }
            50% { stroke-dasharray: 30; stroke-dashoffset: 0; }
            100% { stroke-dasharray: 30; stroke-dashoffset: 30; }
        }
        
        .result-container {
            display: none;
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .app-header {
            display: flex;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid #eee;
            gap: 1.5rem;
        }
        
        .app-icon {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        .app-basic-info {
            flex: 1;
        }
        
        .app-name {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        
        .app-developer {
            font-size: 1.1rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        
        .app-category {
            display: inline-block;
            background-color: #eee;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-right: 0.5rem;
        }
        
        .app-rating {
            display: flex;
            align-items: center;
            margin-top: 0.5rem;
        }
        
        .stars {
            color: #FFCC00;
            margin-right: 0.5rem;
        }
        
        .rating-count {
            color: #666;
            font-size: 0.9rem;
        }
        
        .app-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            padding: 1.5rem;
        }
        
        .detail-section {
            margin-bottom: 1rem;
        }
        
        .detail-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--dark-color);
        }
        
        .detail-content {
            line-height: 1.5;
        }
        
        .app-description {
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }
        
        .detail-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .detail-table tr {
            border-bottom: 1px solid #eee;
        }
        
        .detail-table tr:last-child {
            border-bottom: none;
        }
        
        .detail-table td {
            padding: 0.75rem 0;
        }
        
        .detail-table td:first-child {
            font-weight: 600;
            width: 40%;
        }
        
        .screenshots-container {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding: 1rem 0;
        }
        
        .screenshot {
            height: 400px;
            border-radius: var(--border-radius);
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        .error-message {
            display: none;
            background-color: #fff3f3;
            border-left: 4px solid var(--danger-color);
            padding: 1rem;
            margin-bottom: 1.5rem;
            color: var(--danger-color);
            border-radius: var(--border-radius);
        }

        .json-viewer {
            background-color: #f8f9fa;
            border-radius: var(--border-radius);
            padding: 1.5rem;
            overflow: auto;
            max-height: 400px;
        }

        .json-key {
            color: var(--primary-color);
            font-weight: 600;
        }

        .json-string {
            color: #008000;
        }

        .json-number {
            color: #0000ff;
        }

        .json-boolean {
            color: #b22222;
        }

        .json-null {
            color: #808080;
        }

        .tab-container {
            margin-top: 1rem;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #eee;
        }

        .tab {
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            font-weight: 600;
            color: #666;
        }

        .tab.active {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
        }

        .tab-content {
            padding: 1.5rem;
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            padding: 1rem;
            color: #666;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .search-form {
                flex-direction: column;
            }

            .app-header {
                flex-direction: column;
                text-align: center;
            }

            .app-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>App Store OSINT Tool</h1>
            <p class="subtitle">Extract and analyze iOS app metadata from App Store URLs</p>
        </header>

        <div class="search-container">
            <div class="error-message" id="errorMessage"></div>
            <form id="searchForm" class="search-form">
                <input 
                    type="text" 
                    id="appUrlInput" 
                    class="search-input" 
                    placeholder="Enter App Store URL (e.g., https://apps.apple.com/us/app/...)">
                <button type="submit" class="search-button" id="searchButton">
                <span>Analyze</span>
                <svg class="search-icon-btn" viewBox="0 0 24 24" style="width: 18px; height: 18px; display: none;">
                    <circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="2"></circle>
                    <line x1="16" y1="16" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
                </svg>
            </button>
            </form>
            <p class="example-text">Example: https://apps.apple.com/us/app/taobao-online-shopping-app/id387682726</p>
        </div>

        <div class="loader" id="loader">
            <div class="spinner">
                <svg class="search-icon" viewBox="0 0 50 50">
                    <circle class="circle" cx="20" cy="20" r="15"></circle>
                    <line class="line" x1="30" y1="30" x2="40" y2="40"></line>
                </svg>
            </div>
            <p>Analyzing app data...</p>
        </div>

        <div class="result-container" id="resultContainer">
            <div class="app-header" id="appHeader">
                <!-- App Icon, Name, Developer will be inserted here -->
            </div>

            <div class="tab-container">
                <div class="tabs">
                    <div class="tab active" data-tab="summary">Summary</div>
                    <div class="tab" data-tab="details">Details</div>
                    <div class="tab" data-tab="screenshots">Screenshots</div>
                    <div class="tab" data-tab="raw">Raw JSON</div>
                </div>

                <div class="tab-content">
                    <div class="tab-pane active" id="summaryTab">
                        <div class="app-details" id="appSummary">
                            <!-- Summary content will be inserted here -->
                        </div>
                    </div>

                    <div class="tab-pane" id="detailsTab">
                        <div class="app-details" id="appDetails">
                            <!-- Details content will be inserted here -->
                        </div>
                    </div>

                    <div class="tab-pane" id="screenshotsTab">
                        <div class="screenshots-container" id="appScreenshots">
                            <!-- Screenshots will be inserted here -->
                        </div>
                    </div>

                    <div class="tab-pane" id="rawTab">
                        <div class="json-viewer" id="rawJson">
                            <!-- Raw JSON will be inserted here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>App Store OSINT Tool &copy; 2025 | For research and educational purposes only</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchForm = document.getElementById('searchForm');
            const appUrlInput = document.getElementById('appUrlInput');
            const errorMessage = document.getElementById('errorMessage');
            const loader = document.getElementById('loader');
            const resultContainer = document.getElementById('resultContainer');
            const appHeader = document.getElementById('appHeader');
            const appSummary = document.getElementById('appSummary');
            const appDetails = document.getElementById('appDetails');
            const appScreenshots = document.getElementById('appScreenshots');
            const rawJson = document.getElementById('rawJson');
            
            // Tab functionality
            const tabs = document.querySelectorAll('.tab');
            const tabPanes = document.querySelectorAll('.tab-pane');
            
            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    // Remove active class from all tabs and panes
                    tabs.forEach(t => t.classList.remove('active'));
                    tabPanes.forEach(p => p.classList.remove('active'));
                    
                    // Add active class to current tab and corresponding pane
                    this.classList.add('active');
                    const tabId = this.getAttribute('data-tab') + 'Tab';
                    document.getElementById(tabId).classList.add('active');
                });
            });

            // Function to extract app ID from URL
            function extractAppId(url) {
                const regex = /id(\d+)/;
                const match = url.match(regex);
                
                if (match && match[1]) {
                    return match[1];
                } else {
                    throw new Error("App ID not found in the URL.");
                }
            }

            // Format date string
            function formatDate(dateString) {
                if (!dateString) return 'N/A';
                const date = new Date(dateString);
                return date.toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                });
            }

            // Format file size
            function formatFileSize(bytes) {
                if (!bytes) return 'N/A';
                const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
                if (bytes === 0) return '0 Byte';
                const i = parseInt(Math.floor(Math.log(bytes) / Math.log(1024)));
                return Math.round(bytes / Math.pow(1024, i), 2) + ' ' + sizes[i];
            }

            // Generate star rating display
            function generateStarRating(rating) {
                if (!rating) return 'No ratings';
                
                const fullStars = Math.floor(rating);
                const halfStar = rating % 1 >= 0.5 ? 1 : 0;
                const emptyStars = 5 - fullStars - halfStar;
                
                let stars = '';
                
                for (let i = 0; i < fullStars; i++) {
                    stars += '★';
                }
                
                if (halfStar) {
                    stars += '☆';
                }
                
                for (let i = 0; i < emptyStars; i++) {
                    stars += '☆';
                }
                
                return stars;
            }

            // Format JSON for display
            function formatJsonForDisplay(json) {
                if (typeof json !== 'string') {
                    json = JSON.stringify(json, null, 2);
                }
                
                return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function(match) {
                    let cls = 'json-number';
                    if (/^"/.test(match)) {
                        if (/:$/.test(match)) {
                            cls = 'json-key';
                        } else {
                            cls = 'json-string';
                        }
                    } else if (/true|false/.test(match)) {
                        cls = 'json-boolean';
                    } else if (/null/.test(match)) {
                        cls = 'json-null';
                    }
                    return '<span class="' + cls + '">' + match + '</span>';
                });
            }

            // Handle form submission
            searchForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const appUrl = appUrlInput.value.trim();
                const searchButton = document.getElementById('searchButton');
                const searchButtonText = searchButton.querySelector('span');
                const searchButtonIcon = searchButton.querySelector('.search-icon-btn');
                
                if (!appUrl) {
                    showError("Please enter an App Store URL");
                    return;
                }
                
                try {
                    // Extract app ID from URL
                    const appId = extractAppId(appUrl);
                    
                    // Show loader and hide results/errors
                    errorMessage.style.display = 'none';
                    resultContainer.style.display = 'none';
                    loader.style.display = 'block';
                    
                    // Change button to show searching icon
                    searchButtonText.style.display = 'none';
                    searchButtonIcon.style.display = 'inline-block';
                    searchButton.disabled = true;
                    
                    // Fetch app data from iTunes API
                    const response = await fetch(`https://itunes.apple.com/lookup?id=${appId}`);
                    
                    if (!response.ok) {
                        throw new Error(`API request failed with status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    // Check if we got results
                    if (!data.results || data.results.length === 0) {
                        throw new Error("No app information found for this ID");
                    }
                    
                    // Process and display the app data
                    displayAppData(data);
                    
                } catch (error) {
                    showError(error.message);
                    loader.style.display = 'none';
                } finally {
                    // Reset button state
                    searchButtonText.style.display = 'inline';
                    searchButtonIcon.style.display = 'none';
                    searchButton.disabled = false;
                }
            });

            // Show error message
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
            }

            // Display app data in UI
            function displayAppData(data) {
                // Hide loader
                loader.style.display = 'none';
                
                // Get app info from the first result
                const app = data.results[0];
                
                // Display raw JSON
                rawJson.innerHTML = formatJsonForDisplay(data);
                
                // Create app header
                appHeader.innerHTML = `
                    <img src="${app.artworkUrl512 || app.artworkUrl100}" alt="${app.trackName}" class="app-icon">
                    <div class="app-basic-info">
                        <h2 class="app-name">${app.trackName}</h2>
                        <p class="app-developer">${app.artistName}</p>
                        <div>
                            <span class="app-category">${app.primaryGenreName}</span>
                            ${app.genres ? app.genres.slice(1).map(genre => `<span class="app-category">${genre}</span>`).join('') : ''}
                        </div>
                        <div class="app-rating">
                            <span class="stars">${generateStarRating(app.averageUserRating)}</span>
                            <span class="rating-count">${app.userRatingCount ? `(${app.userRatingCount.toLocaleString()} ratings)` : '(No ratings)'}</span>
                        </div>
                    </div>
                `;
                
                // Create app summary
                appSummary.innerHTML = `
                    <div class="detail-section">
                        <h3 class="detail-title">Description</h3>
                        <div class="app-description">
                            ${app.description.replace(/\n/g, '<br>')}
                        </div>
                    </div>
                    
                    <div class="detail-section">
                        <h3 class="detail-title">Key Information</h3>
                        <table class="detail-table">
                            <tr>
                                <td>Price</td>
                                <td>${app.formattedPrice || 'Free'}</td>
                            </tr>
                            <tr>
                                <td>Size</td>
                                <td>${formatFileSize(app.fileSizeBytes)}</td>
                            </tr>
                            <tr>
                                <td>Age Rating</td>
                                <td>${app.contentAdvisoryRating}</td>
                            </tr>
                            <tr>
                                <td>Developer</td>
                                <td>${app.artistName}</td>
                            </tr>
                            <tr>
                                <td>Languages</td>
                                <td>${app.languageCodesISO2A ? app.languageCodesISO2A.join(', ') : 'Not specified'}</td>
                            </tr>
                        </table>
                    </div>
                `;
                
                // Create app details
                appDetails.innerHTML = `
                    <div class="detail-section">
                        <h3 class="detail-title">Version Information</h3>
                        <table class="detail-table">
                            <tr>
                                <td>Current Version</td>
                                <td>${app.version}</td>
                            </tr>
                            <tr>
                                <td>Current Version Release</td>
                                <td>${formatDate(app.currentVersionReleaseDate)}</td>
                            </tr>
                            <tr>
                                <td>First Released</td>
                                <td>${formatDate(app.releaseDate)}</td>
                            </tr>
                            <tr>
                                <td>Minimum OS Version</td>
                                <td>iOS ${app.minimumOsVersion}</td>
                            </tr>
                        </table>
                    </div>
                    
                    <div class="detail-section">
                        <h3 class="detail-title">Developer Information</h3>
                        <table class="detail-table">
                            <tr>
                                <td>Developer</td>
                                <td>${app.artistName}</td>
                            </tr>
                            <tr>
                                <td>Developer ID</td>
                                <td>${app.artistId}</td>
                            </tr>
                            <tr>
                                <td>Developer Website</td>
                                <td>${app.sellerUrl ? `<a href="${app.sellerUrl}" target="_blank">${app.sellerUrl}</a>` : 'Not provided'}</td>
                            </tr>
                            <tr>
                                <td>Support Website</td>
                                <td>${app.supportUrl ? `<a href="${app.supportUrl}" target="_blank">${app.supportUrl}</a>` : 'Not provided'}</td>
                            </tr>
                            <tr>
                                <td>Privacy Policy</td>
                                <td>${app.trackCensoredName ? `<a href="${app.trackCensoredName}" target="_blank">${app.trackCensoredName}</a>` : 'Not provided'}</td>
                            </tr>
                        </table>
                    </div>
                    
                    <div class="detail-section">
                        <h3 class="detail-title">Store Information</h3>
                        <table class="detail-table">
                            <tr>
                                <td>App Store ID</td>
                                <td>${app.trackId}</td>
                            </tr>
                            <tr>
                                <td>Bundle ID</td>
                                <td>${app.bundleId}</td>
                            </tr>
                            <tr>
                                <td>App Store URL</td>
                                <td><a href="${app.trackViewUrl}" target="_blank">${app.trackViewUrl}</a></td>
                            </tr>
                        </table>
                    </div>
                `;
                
                // Create screenshots gallery
                appScreenshots.innerHTML = '';
                
                if (app.screenshotUrls && app.screenshotUrls.length > 0) {
                    app.screenshotUrls.forEach(url => {
                        appScreenshots.innerHTML += `<img src="${url}" alt="App Screenshot" class="screenshot">`;
                    });
                } else {
                    appScreenshots.innerHTML = '<p>No screenshots available</p>';
                }
                
                // Show the result container
                resultContainer.style.display = 'block';
                
                // Reset to the summary tab
                tabs.forEach(t => t.classList.remove('active'));
                tabPanes.forEach(p => p.classList.remove('active'));
                document.querySelector('.tab[data-tab="summary"]').classList.add('active');
                document.getElementById('summaryTab').classList.add('active');
            }
        });
    </script>
</body>
</html>
